name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Project (optional)
      run: echo "No build required for backend"

    - name: Restart PM2 app
      run: |
        cd $GITHUB_WORKSPACE
        pm2 stop TodoBackend || true
        pm2 delete TodoBackend || true
        pm2 start index.js --name TodoBackend
        pm2 save
